(function(){try{

  if(n=='user'){const u=await lg();const ad=cfg.admins||[];
    return{me:async()=>({id:u.uid,name:u.displayName||('User '+u.uid.slice(0,4)),isOwner:ad.includes(u.email)||ad.includes(u.uid)}),id:async()=>u.uid}}
